name: Sync main to upstream release tag

on:
  schedule:
    - cron: "17 * * * *" # hourly at :17
  workflow_dispatch: # manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/openclaw/openclaw.git

      - name: Fetch upstream tags
        run: git fetch upstream --tags

      - name: Find latest stable tag
        id: tag
        run: |
          LATEST=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest stable tag: $LATEST"

      - name: Check if main needs update
        id: check
        run: |
          if git merge-base --is-ancestor origin/main ${{ steps.tag.outputs.tag }} && \
             ! git merge-base --is-ancestor ${{ steps.tag.outputs.tag }} origin/main; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "main is behind ${{ steps.tag.outputs.tag }}, will sync"
          else
            echo "behind=false" >> "$GITHUB_OUTPUT"
            echo "main is up to date"
          fi

      - name: Fast-forward main
        if: steps.check.outputs.behind == 'true'
        run: |
          git push origin "${{ steps.tag.outputs.tag }}^{}:refs/heads/main"
          echo "Synced main to ${{ steps.tag.outputs.tag }}"
